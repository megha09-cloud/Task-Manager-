<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-shapes">
  <div class="shape shape-one"></div>
  <div class="shape shape-two"></div>
  <div class="shape shape-three"></div>
</div>

<div class="app-container">

  <header class="app-header">
    <div class="header-icon">✅</div>
    <div class="header-text">
      <h1>TaskFlow</h1>
      <p>Stay organized, stay ahead</p>
    </div>
  </header>

  <main class="main-card">

    <div class="input-section">
      <div class="input-wrapper">
        <input type="text" id="taskInput" placeholder="What do you need to do?" maxlength="120">
        <button id="addTaskBtn" class="add-btn">
          <span class="btn-icon">+</span>
          <span>Add Task</span>
        </button>
      </div>
      <p class="error-message" id="errorMessage">Please type a task before adding it.</p>
    </div>

    <div class="stats-bar">
      <div class="stat-box">
        <span class="stat-number" id="totalCount">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-box">
        <span class="stat-number" id="activeCount">0</span>
        <span class="stat-label">Active</span>
      </div>
      <div class="stat-box">
        <span class="stat-number" id="completedCount">0</span>
        <span class="stat-label">Completed</span>
      </div>
    </div>

    <div class="controls-row">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search tasks...">
      </div>

      <div class="filter-buttons" id="filterButtons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🗒️</div>
      <p class="empty-title">No tasks here</p>
      <p class="empty-subtitle">Add a new task above to get started</p>
    </div>

    <div class="footer-actions">
      <span class="footer-hint" id="footerHint"></span>
      <button class="clear-btn" id="clearCompletedBtn">Clear Completed</button>
    </div>

  </main>

  <footer class="page-footer">
    <p>Built for productivity, one task at a time.</p>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
